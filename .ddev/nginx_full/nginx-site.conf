# NIDQC: Drupal headless + Nuxt SSR reverse proxy (ADR-004). Marker đã gỡ để DDEV không ghi đè.
upstream nuxt_ssr { server 127.0.0.1:3000; }

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    root /var/www/html/web;
    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;
    include /etc/nginx/monitoring.conf;
    index index.php index.htm index.html;
    sendfile off;
    error_log /dev/stdout info;
    access_log /var/log/nginx/access.log;

    # Drupal: API + admin + quản trị (khớp TRƯỚC vì regex/prefix cụ thể hơn)
    location ~ ^/(jsonapi|admin|user|node|taxonomy|batch|system|oauth|session|cron|update\.php) {
        try_files $uri $uri/ /index.php?$query_string;
    }
    # Drupal: assets tĩnh
    location ~ ^/(sites|core|modules|themes|libraries|profiles)/ {
        try_files $uri @rewrite;
    }
    # robots.txt + sitemap.xml do Nuxt sinh (SEO/GEO cho toàn bộ trang Nuxt render).
    location = /robots.txt {
        proxy_pass http://nuxt_ssr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass http://nuxt_ssr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @rewrite { rewrite ^ /index.php; }

    location ~ '\.php$|^/update.php' {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_buffers 16 16k; fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php; include fastcgi_params;
        fastcgi_intercept_errors off; fastcgi_read_timeout 10m;
        fastcgi_param SERVER_NAME $host; fastcgi_param HTTPS $fcgi_https;
    }

    location ~* /\.(?!well-known\/) { deny all; }

    # Frontend + Nuxt assets: proxy tới Nuxt SSR (mặc định)
    location / {
        proxy_pass http://nuxt_ssr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    include /etc/nginx/common.d/*.conf;
    include /mnt/ddev_config/nginx/*.conf;
}
