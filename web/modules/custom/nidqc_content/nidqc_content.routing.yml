nidqc_content.news_search:
  path: '/api/v1/news/search'
  defaults:
    _controller: '\Drupal\nidqc_content\Controller\NewsSearchController::search'
    _format: 'json'
  requirements:
    _permission: 'access content'
  methods: [GET]

nidqc_content.news_list:
  path: '/api/v1/news/list'
  defaults:
    _controller: '\Drupal\nidqc_content\Controller\NewsListController::list'
    _format: 'json'
  requirements:
    _permission: 'access content'
  methods: [GET]

nidqc_content.news_media:
  path: '/api/v1/news/media'
  defaults:
    _controller: '\Drupal\nidqc_content\Controller\NewsMediaController::list'
    _format: 'json'
  requirements:
    _permission: 'access content'
  methods: [GET]

nidqc_content.news_detail:
  path: '/api/v1/news/detail'
  defaults:
    _controller: '\Drupal\nidqc_content\Controller\NewsDetailController::detail'
    _format: 'json'
  requirements:
    _permission: 'access content'
  methods: [GET]

nidqc_content.static_page:
  path: '/api/v1/page'
  defaults:
    _controller: '\Drupal\nidqc_content\Controller\StaticPageController::detail'
    _format: 'json'
  requirements:
    _permission: 'access content'
  methods: [GET]

nidqc_content.home_blocks:
  path: '/api/v1/home/blocks'
  defaults:
    _controller: '\Drupal\nidqc_content\Controller\HomeBlocksController::blocks'
    _format: 'json'
  requirements:
    _permission: 'access content'
  methods: [GET]
