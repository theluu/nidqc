nidqc_contact.settings:
  path: '/admin/config/nidqc/settings'
  defaults:
    _form: '\Drupal\nidqc_contact\Form\NidqcSettingsForm'
    _title: 'Cấu hình website NIDQC'
  requirements:
    _permission: 'administer site configuration'

nidqc_contact.public_config:
  path: '/api/v1/contact/config'
  defaults:
    _controller: '\Drupal\nidqc_contact\Controller\ContactController::publicConfig'
  methods: [GET]
  requirements:
    # Public by design: only exposes the browser-visible reCAPTCHA site key.
    _access: 'TRUE'

nidqc_contact.csrf_token:
  path: '/api/v1/contact/csrf-token'
  defaults:
    _controller: '\Drupal\nidqc_contact\Controller\ContactController::csrfToken'
  methods: [GET]
  requirements:
    # Public endpoint only returns a session-bound CSRF token for contact POST.
    _access: 'TRUE'

nidqc_contact.submit:
  path: '/api/v1/contact'
  defaults:
    _controller: '\Drupal\nidqc_contact\Controller\ContactController::submit'
  methods: [POST]
  requirements:
    # Public contact endpoint. Controller enforces CSRF, reCAPTCHA and flood.
    _access: 'TRUE'
