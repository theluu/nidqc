nidqc_contact.settings:
  type: config_object
  label: 'NIDQC contact settings'
  mapping:
    smtp:
      type: mapping
      label: 'SMTP'
      mapping:
        charset:
          type: string
          label: 'Message character set'
        host:
          type: string
          label: 'Host'
        auth:
          type: boolean
          label: 'Authentication enabled'
        port:
          type: integer
          label: 'Port'
        security:
          type: string
          label: 'Security mode'
        admin_email:
          type: email
          label: 'Administrative recipient'
    recaptcha:
      type: mapping
      label: 'reCAPTCHA v3'
      mapping:
        site_key:
          type: string
          label: 'Site key'
        minimum_score:
          type: float
          label: 'Minimum score'
    social:
      type: mapping
      label: 'Social networks'
      mapping:
        facebook:
          type: string
          label: 'Facebook page URL'
        youtube:
          type: string
          label: 'YouTube channel URL'
        zalo:
          type: string
          label: 'Zalo official account URL'
