# Nền cho khối "Thống kê truy cập" ở trang chủ.
#
# Bảng đếm thật (nidqc_visit_daily) chỉ có dữ liệu từ ngày module được bật, nên
# nếu không có nền thì trang chủ hiện "Tổng truy cập: 4". Các số dưới đây dựng
# một đường nền ƯỚC LƯỢNG cho quãng trước đó; lượt truy cập thật vẫn được đếm
# chính xác và CỘNG THÊM lên nền này.
#
# Sửa xong nhớ: drush cex  (config phải đi qua git, xem scripts/deploy.sh).
baseline:
  # FALSE = hiện đúng số đếm thật, không cộng nền.
  enabled: true
  # Mốc bắt đầu tính nền — lấy theo thời điểm trang web cũ của Viện đi vào hoạt động.
  start_date: '2016-01-01'
  # Trung bình lượt/ngày ở năm start_date (đã gộp cả ngày thường và cuối tuần).
  daily_average: 810
  # Cuối tuần vắng hơn ngày thường bao nhiêu (0.55 = còn 55%).
  weekend_factor: 0.55
  # Biên độ dao động giữa các ngày (0.18 = ±18%), xác định theo ngày nên không nhảy số.
  jitter: 0.18
  # Mức tăng lưu lượng mỗi năm (0.06 = +6%/năm) so với năm start_date.
  growth_per_year: 0.06
