# Library của theme NIDQC.
#
# THỨ TỰ QUAN TRỌNG: tokens.css phải đứng trước base.css và layout.css vì cả hai
# dùng biến do tokens.css định nghĩa. Drupal xếp theo nhóm (base -> theme) rồi
# theo thứ tự khai báo trong nhóm, nên tokens.css nằm nhóm `base` là đủ đảm bảo.
global:
  version: 1.x
  css:
    base:
      # fonts.css TRƯỚC tokens.css: @font-face phải được khai báo trước khi có gì
      # dùng tới. Drupal giữ nguyên thứ tự khai báo trong cùng nhóm.
      css/fonts.css: {}
      css/tokens.css: {}
    theme:
      css/base.css: {}
      css/layout.css: {}
