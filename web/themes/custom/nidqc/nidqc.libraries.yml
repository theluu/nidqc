# Library của theme NIDQC.
#
# THỨ TỰ QUAN TRỌNG: tokens.css phải đứng trước base.css và layout.css vì cả hai
# dùng biến do tokens.css định nghĩa. Drupal xếp theo nhóm (base -> theme) rồi
# theo thứ tự khai báo trong nhóm, nên tokens.css nằm nhóm `base` là đủ đảm bảo.
global:
  version: 1.x
  css:
    base:
      # fonts.css TRƯỚC tokens.css: @font-face phải được khai báo trước khi có gì
      # dùng tới. Drupal giữ nguyên thứ tự khai báo trong cùng nhóm.
      css/fonts.css: {}
      css/tokens.css: {}
    theme:
      css/base.css: {}
      css/layout.css: {}

# Vue island — TÁCH khỏi `global` có chủ đích.
#
# Island CHỈ nạp ở trang cần, qua #attached trong preprocess. Nhét vào `global`
# là bắt mọi trang tải JS mà 97,9% nội dung không cần (xem docs/ROADMAP.md §5).
#
# Hiện chưa nạp ở đâu — registry trong main.js còn rỗng. Island đầu tiên là TASK-006.
# File dist/islands.js do Vite build ra, KHÔNG commit (xem .gitignore).
islands:
  version: 1.x
  js:
    dist/islands.js: { attributes: { type: module, defer: true } }

# Trang chủ — chỉ nạp ở front (nidqc_preprocess_page).
front:
  version: 1.x
  css:
    theme:
      css/front.css: {}
