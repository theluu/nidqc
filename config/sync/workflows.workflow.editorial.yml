_core:
  default_config_hash: T7gMMyFbTYLalxpIOnzJebvek2OW0b1RgLVE9I2y228
id: editorial
label: Editorial
type: content_moderation
type_settings:
  states:
    # Chỉ còn HAI trạng thái (16/09/2026). Trước đây có thêm "Bản nháp" ở giữa:
    # thừa một bước vì người viết luôn phải gửi kiểm duyệt, mà bài ĐÃ XUẤT BẢN
    # khi mở ra sửa lại chỉ còn đúng một lựa chọn là "Bản nháp" — không ai lưu
    # được mà giữ nguyên trạng thái đang đăng.
    #
    # ID vẫn là 'draft' chứ không phải 'needs_review': plugin content_moderation
    # của core khai báo 'draft' và 'published' là REQUIRED STATES, xoá đi thì
    # config:import chết với "requires states with the ID 'draft'". ID nằm trong
    # máy, người dùng chỉ nhìn thấy nhãn.
    draft:
      label: 'Chờ kiểm duyệt'
      weight: 0
      published: false
      # false: sửa bài ĐANG ĐĂNG thì tạo bản chờ duyệt, bản trên website vẫn
      # chạy cho tới khi được phê duyệt. Để true là bài tụt khỏi site ngay lúc
      # người viết bấm lưu.
      default_revision: false
    published:
      label: 'Đã xuất bản'
      weight: 5
      published: true
      default_revision: true
  transitions:
    submit_for_review:
      label: 'Gửi kiểm duyệt'
      from:
        - draft
        - published
      to: draft
      weight: 1
    publish:
      label: 'Phê duyệt và xuất bản'
      from:
        - draft
        # published -> published: lãnh đạo sửa bài đang đăng rồi lưu là xong,
        # bài giữ nguyên trên website, không phải đi lại một vòng duyệt.
        - published
      to: published
      weight: 4
  entity_types:
    node:
      # Mọi loại nội dung biên tập viên nhập được đều qua kiểm duyệt (17/09/2026):
      # người viết bài được tạo cả trang tĩnh, văn bản, banner... nên nếu loại đó
      # nằm ngoài workflow thì bài lên website ngay khi lưu. Chỉ chừa
      # contact_submission — do form liên hệ ngoài website tạo, không ai nhập tay.
      - banner
      - capability
      - certificate
      - department
      - document
      - equipment
      - expertise
      - faq
      - home_block
      - news
      - office
      - page
      - project
      - service
      - service_post
      - web_link
  default_moderation_state: draft
