uuid: 228e55e1-9c0d-4adc-9443-1c4cd76f93b6
langcode: vi
status: true
dependencies:
  config:
    - node.type.news
  module:
    - content_moderation
_core:
  default_config_hash: T7gMMyFbTYLalxpIOnzJebvek2OW0b1RgLVE9I2y228
id: editorial
label: Editorial
type: content_moderation
type_settings:
  states:
    # Bỏ trạng thái "Bản nháp" (16/09/2026). Ba trạng thái là thừa một: người
    # viết luôn phải gửi kiểm duyệt, nên nháp chỉ làm thêm một lần bấm. Tệ hơn,
    # bài ĐÃ XUẤT BẢN khi mở ra sửa chỉ còn đúng một lựa chọn là "Bản nháp" —
    # không có cách nào lưu mà giữ nguyên trạng thái đang đăng.
    needs_review:
      label: 'Chờ kiểm duyệt'
      weight: 0
      published: false
      # false: sửa bài ĐANG ĐĂNG sẽ tạo bản chờ duyệt, bản trên website vẫn
      # chạy tới khi được phê duyệt. Để true thì bài tụt khỏi site ngay lúc
      # người viết bấm lưu.
      default_revision: false
    published:
      label: 'Đã xuất bản'
      weight: 5
      published: true
      default_revision: true
  transitions:
    submit_for_review:
      label: 'Gửi kiểm duyệt'
      from:
        - needs_review
        - published
      to: needs_review
      weight: 1
    publish:
      label: 'Phê duyệt và xuất bản'
      from:
        - needs_review
        # published -> published: lãnh đạo sửa bài đang đăng rồi lưu, bài giữ
        # nguyên trên website, không phải duyệt lại vòng nữa.
        - published
      to: published
      weight: 4
  entity_types:
    node:
      - news
  default_moderation_state: needs_review
